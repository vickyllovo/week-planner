<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VickyLog</title>
<style>
:root{--bg:#FDFBF7;--card:#FFFDFA;--text:#3A322B;--t2:#8C8279;--t3:#C2B8A3;--ac:#D97736;--acs:#FDF3E8;--dg:#D9534F;--sc:#5C9A71;--hb:#F4F0E8;--sep:#EFE9DF;--rc:10px;--rb:8px;--sh:0 1px 6px rgba(160,130,90,.04)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit}
header{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--sep);z-index:10}
.ht{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px}
.tabs{display:flex;background:var(--hb);border-radius:var(--rb);padding:3px;flex:1;max-width:340px}
.tab{flex:1;padding:6px 0;text-align:center;border-radius:6px;background:0;color:var(--t2);border:0;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sbh{background:var(--ac);color:#fff;border:0;border-radius:var(--rb);padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.hb2{text-align:center;font-size:13px;font-weight:600;color:var(--text)}
.view{flex:1;display:none;overflow:hidden;padding:4px;gap:4px}
.view.active{display:flex}
#view-plan{flex-direction:row}
.lp{width:33.33%;flex:none;display:flex;flex-direction:column;overflow-y:auto;background:var(--card);border-radius:var(--rc);box-shadow:var(--sh)}
.dg{display:flex;flex-direction:column;border-bottom:1px solid var(--sep)}
.dg:last-child{border-bottom:0}
.dh{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 8px 6px;cursor:pointer}
.dh.active{background:var(--acs);border-left:3px solid var(--ac)}
.dn{font-size:22px;font-weight:700;line-height:1.1}
.dm{font-size:14px;font-weight:600;color:var(--t2)}
.tl{padding:0 2px 8px;display:flex;flex-direction:column}
.ti{display:flex;align-items:flex-start;gap:4px;padding:4px;border-radius:6px;cursor:pointer}
.ti.active{background:var(--acs)}
.ti .chk{width:14px;height:14px;border-radius:50%;border:2px solid var(--t3);background:var(--card);flex:none;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;margin-top:3px}
.ti.done .chk{background:var(--ac);border-color:var(--ac)}
.ti.done .chk::after{content:'';width:3px;height:6px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(45deg) translate(-1px,-1px)}
.tc{flex:1;min-width:0;display:flex;flex-direction:column}
.ti .ttl{font-size:12px;word-break:break-word;line-height:1.4;user-select:none;font-weight:500}
.tp{font-size:10px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
.ti.done .ttl{color:var(--t3);text-decoration:line-through}
.ti.done .tp{text-decoration:line-through;opacity:.5}
.rp{flex:1;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.rc{background:var(--card);border-radius:var(--rc);padding:12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px}
.notice-card{background:#FFF9F0;border:1px solid #F2E3C6;border-left:4px solid var(--ac);padding:10px 12px;display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.notice-title{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--ac)}
.notice-close{background:none;border:none;color:var(--t3);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.notice-content{font-size:13px;line-height:1.5;color:var(--text)}
.notice-content b{color:var(--ac)}
.it{font-size:12px;font-weight:600;color:var(--ac);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.iir{display:flex;gap:4px}
.iir input{flex:1;border:1px solid var(--sep);border-radius:6px;padding:6px 8px;font-size:12px;outline:0;background:var(--bg);color:var(--text);min-width:0}
.iir button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:0 10px;font-size:14px;cursor:pointer}
.iti{display:flex;align-items:flex-start;gap:6px;padding:6px 0;border-bottom:1px solid var(--sep);font-size:12px}
.iti:last-child{border-bottom:0}
.iti .chk{margin-top:2px}
.iti .tc{flex:1;min-width:0}
.iti .ttl{font-size:12px;word-break:break-word;line-height:1.4;font-weight:500}
.iti .tp{font-size:10px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iti select{font-size:11px;border:1px solid var(--sep);border-radius:4px;background:var(--card);color:var(--t2);outline:0;max-width:60px;margin-top:2px}
.ntc .ct{font-size:13px;font-weight:600;margin-bottom:6px}
.ntf{display:flex;flex-direction:column;gap:8px}
.ntf input,.ntf textarea{width:100%;border:1px solid var(--sep);border-radius:6px;padding:8px 10px;font-size:12px;outline:0;background:var(--bg);color:var(--text)}
.ntf textarea{resize:vertical;min-height:50px}
.ntf input:focus,.ntf textarea:focus{border-color:var(--ac);background:var(--card)}
.fr{display:flex;gap:6px;align-items:center}
.fr input[type=datetime-local]{flex:1}
.addb{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
.hint{font-size:10px;color:var(--t3);margin-top:-2px}
.dhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.dtt{font-weight:600;font-size:14px}
.ddt{font-size:12px;color:var(--t2)}
.tda{background:#FDFCF9;border:1px solid var(--sep);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.tda .tr input{width:100%;border:0;border-bottom:1px solid var(--sep);font-size:14px;font-weight:600;background:0;outline:0;padding-bottom:4px;color:var(--text)}
.tda .tmr input{width:100%;border:0;font-size:12px;background:0;outline:0;color:var(--t2)}
.tda .dr textarea{width:100%;border:1px solid var(--sep);border-radius:6px;padding:8px;font-size:12px;resize:vertical;outline:0;min-height:60px;background:var(--card);color:var(--text)}
.tact{display:flex;gap:6px;margin-top:4px}
.tact button{padding:8px 12px;border-radius:6px;border:0;font-size:12px;font-weight:600;cursor:pointer}
.delb{background:#FDE8E8;color:var(--dg)}
.savb{background:var(--ac);color:#fff;flex:1}
.nst{color:var(--t3);font-size:12px;padding:8px 0;text-align:center}
.rf{background:var(--card);border-radius:var(--rc);padding:10px;box-shadow:var(--sh);display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.rf button{background:var(--hb);color:var(--ac);border:0;border-radius:var(--rb);padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.rf .wd{font-size:13px;font-weight:600;cursor:pointer;padding:4px 12px;border-radius:6px;background:var(--acs)}

/* 总结页 */
#view-book{flex-direction:column;gap:8px}
.bt{display:flex;gap:4px;justify-content:center;flex:none}
.bt button{background:var(--hb);color:var(--t2);border:0;border-radius:16px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer}
.bt button.active{background:var(--ac);color:#fff}
.bkt{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border-radius:var(--rc);box-shadow:var(--sh);overflow:hidden}
.bkb{flex:0 0 135px;display:flex;flex-direction:column;background:var(--card);border-radius:var(--rc);box-shadow:var(--sh);padding:8px 10px;min-height:110px}
.bbt{font-size:12px;font-weight:600;color:var(--ac);margin-bottom:4px;flex:none}
.bba{display:flex;justify-content:flex-end;margin-top:4px;flex:none}
.bba button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer}
.chb{padding:10px 12px;border-bottom:1px solid var(--sep);background:#FDFCF9;display:flex;justify-content:space-between;align-items:center;flex:none}
.chb h3{margin:0;font-size:15px;font-weight:600}
.chb p{margin:0;font-size:12px;color:var(--t2)}
.mc{flex:1;min-height:0;display:flex;flex-direction:column;padding:4px;overflow:hidden;background:var(--card)}
.mw{flex:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-bottom:2px}
.mwd{text-align:center;padding:4px 0;font-size:11px;font-weight:600;color:var(--t2)}
.mdg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:2px}
.mdc{min-width:0;min-height:0;border:1px solid var(--sep);border-radius:6px;background:var(--bg);padding:4px;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;position:relative}
.mdc:active{background:var(--acs)}
.mdc.om{opacity:.35;background:#F8F6F1}
.mdc.td{background:var(--acs);border-color:var(--ac)}
.mdh{display:flex;justify-content:space-between;align-items:center;flex:none;min-height:22px}
.mdn{font-size:13px;font-weight:700}
.mdc.td .mdn{color:var(--ac)}
.mdp{display:flex;gap:2px;align-items:center}
.mdph{width:22px;height:22px;object-fit:cover;border-radius:4px;border:1px solid rgba(0,0,0,.06);flex:none}
.mdt{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px;margin-top:3px}
.mt{font-size:9px;line-height:1.3;padding:2px 3px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt.pd{background:var(--acs);color:var(--ac);border-left:2px solid var(--ac)}
.mt.dn{background:#F0F0F0;color:var(--t3);text-decoration:line-through}
.mm{font-size:8px;color:var(--t2);text-align:center}
.wsv{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--card)}
.wst{flex:none;font-size:16px;font-weight:700;color:var(--ac);text-align:center;padding:10px;cursor:pointer;border-bottom:1px solid var(--sep);display:flex;align-items:center;justify-content:center;gap:6px}
.wst .ar{font-size:12px;color:var(--t3)}
.wdl{flex:1;min-height:0;overflow-y:auto;padding:4px}
.wdr{display:flex;gap:6px;padding:6px 4px;border-bottom:1px solid var(--sep);align-items:stretch;cursor:pointer;min-height:56px}
.wdr:last-child{border-bottom:0}
.wdr.td{background:var(--acs);border-radius:6px}
.wdd{width:52px;flex:none;font-size:12px;font-weight:600;line-height:1.4}
.wdn{display:block;font-size:10px;color:var(--t2);font-weight:500;margin-top:2px}
.wdp{width:100px;flex:none;display:flex;gap:3px;align-items:center}
.wdph{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none;border:1px solid rgba(0,0,0,.06)}
.wdpe{font-size:11px;color:var(--t3)}
.wdt{flex:1;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;min-width:0}
.wdtg{font-size:11px;padding:2px 6px;background:var(--acs);color:var(--ac);border-radius:4px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.wdtg.dn{background:#F0F0F0;color:var(--t3);text-decoration:line-through}
.wdte{font-size:11px;color:var(--t3)}
.mwv{flex:1;min-height:0;overflow-y:auto;padding:6px}
.mwb{border:1px solid var(--sep);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--bg);cursor:pointer}
.mwb:active{background:var(--acs);border-color:var(--ac)}
.mwh{font-size:13px;font-weight:700;color:var(--ac);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.mwh .rg{font-size:11px;font-weight:500;color:var(--t2)}
.mwds{display:flex;flex-direction:column;gap:3px}
.mwdr{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:2px 0}
.mwdr .dc{font-weight:600;color:var(--ac)}
.mwdr .dc.z{color:var(--t3);font-weight:500}
.ysv{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--card)}
.yst{flex:none;font-size:18px;font-weight:700;color:var(--ac);text-align:center;padding:12px;cursor:pointer;border-bottom:1px solid var(--sep);display:flex;align-items:center;justify-content:center;gap:6px}
.yst .ar{font-size:12px;color:var(--t3)}
.yg{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px}
.ymc{background:var(--bg);border:1px solid var(--sep);border-radius:8px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;aspect-ratio:1}
.ymc:active{background:var(--acs);border-color:var(--ac)}
.ymn{font-size:16px;font-weight:700}
.ymct{font-size:11px;color:var(--t2);margin-top:4px}
.ddb{padding:8px 0;border-bottom:1px dashed var(--sep)}
.ddb:last-child{border-bottom:0}
.ddh{font-size:13px;font-weight:600;color:var(--ac);margin-bottom:4px}
.dtl{display:flex;flex-direction:column;gap:2px}
.dtk{font-size:12px;line-height:1.5;display:flex;gap:4px}
.dtk.dn{color:var(--t3);text-decoration:line-through}
.dtk .mk{flex:none}
.dnt{min-height:40px;padding:10px;background:var(--bg);border-radius:8px;font-size:13px;line-height:1.6;white-space:pre-wrap;margin-bottom:12px}
.bsta{flex:1;width:100%;border:1px solid var(--sep);border-radius:8px;background:var(--bg);font-size:13px;resize:none;outline:0;line-height:1.6;padding:8px;min-height:40px}
.bsta:focus{border-color:var(--ac);background:var(--card)}
.bnv{display:flex;justify-content:space-between;align-items:center;padding:4px 0;flex:none}
.bnv button{background:var(--hb);color:var(--ac);border:0;border-radius:var(--rb);padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}

/* 习惯页 */
#view-habits{flex-direction:column;gap:0}
.hh{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 12px}
.htabs{display:flex;background:var(--hb);border-radius:var(--rb);padding:3px;flex:1;max-width:240px;margin-right:10px}
.htab{flex:1;padding:6px 0;text-align:center;border-radius:6px;background:0;color:var(--t2);border:0;font-size:13px;font-weight:600;cursor:pointer}
.htab.active{background:var(--card);color:var(--ac);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ahb{background:var(--ac);color:#fff;border:0;border-radius:var(--rb);padding:6px 14px;cursor:pointer;font-size:13px;font-weight:600}
.hl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:20px}
.hc{background:var(--card);border-radius:var(--rc);padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
.ht2{display:flex;justify-content:space-between;align-items:center}
.hn{font-weight:600;font-size:16px}
.hs{font-size:12px;color:var(--ac);background:#FEF3E2;padding:3px 8px;border-radius:10px;font-weight:500}
.hmc{overflow-x:auto;padding-bottom:6px}
.hmg{display:grid;grid-template-rows:repeat(7,16px);grid-auto-flow:column;grid-auto-columns:16px;gap:3px;padding-bottom:2px}
.hm{width:16px;height:16px;border-radius:4px;background:var(--hb);cursor:pointer}
.hm.fu{background:0;cursor:default}
.hml{display:flex;gap:8px;font-size:10px;color:var(--t2);padding:4px 0 0;align-items:center}
.hml .sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.hf{display:flex;justify-content:space-between;align-items:center}
.ha button{background:0;border:0;color:var(--t2);cursor:pointer;font-size:12px}
.cib{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
.cib.ck{background:var(--hb);color:var(--t2)}
.htr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.group-title{font-size:15px;font-weight:700;color:var(--text);margin:10px 4px 0;display:flex;align-items:center;gap:6px}
.group-title span{font-size:12px;color:var(--t2);font-weight:500}
.overall-hm-card{background:linear-gradient(135deg,#FFFDFA,#FDF7EE);border:1px solid var(--ac)}
.wt-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--sep);font-size:13px}
.wt-row:last-child{border-bottom:0}
.wt-day{font-weight:600;width:40px;color:var(--t2);flex:none}
.wt-task{flex:1;color:var(--text);margin-left:8px;cursor:pointer}
.wt-task.empty{color:var(--t3);font-style:italic;}
.wt-btn{background:var(--card);border:1px solid var(--sep);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--t2)}
.wt-btn.done{background:var(--sc);color:#fff;border-color:var(--sc)}
.wt-btn.add{border-style:dashed}

#view-lists{flex-direction:column;gap:8px;overflow-y:auto;padding:8px}
.lh{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 8px}
.lh h2{margin:0;font-size:18px;font-weight:600}
.lg{display:grid;grid-template-columns:1fr;gap:10px;padding-bottom:20px}
.lc{background:var(--card);border-radius:var(--rc);padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}
.lch{display:flex;justify-content:space-between;align-items:center}
.lct{font-weight:600;font-size:15px}
.lca button{background:0;border:0;color:var(--t2);cursor:pointer}
.lp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2)}
.pb{flex:1;height:5px;background:#F0ECE3;border-radius:3px;overflow:hidden}
.pf{height:100%;background:var(--ac);border-radius:3px}
.li{display:flex;flex-direction:column;max-height:220px;overflow-y:auto}
.lit{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--sep);font-size:13px}
.lit:last-child{border-bottom:0}
.csq{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--t3);background:var(--card);flex:none;cursor:pointer;padding:0}
.lit.dn .csq{background:var(--sc);border-color:var(--sc)}
.lit.dn .csq::after{content:'';display:block;width:3px;height:6px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(45deg) translate(-1px,-1px)}
.lit.dn .ttl{color:var(--t3);text-decoration:line-through}
.atr{display:flex;gap:5px}
.atr input{flex:1;min-width:0;border:1px solid var(--sep);border-radius:6px;padding:6px 8px;background:var(--bg);outline:0;font-size:12px}
.atr button{width:32px;border:0;border-radius:6px;background:var(--ac);color:#fff;font-size:18px}
.mo{position:fixed;inset:0;background:rgba(58,50,43,.3);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center}
.mo.show{display:flex}
@keyframes su{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.mc2{background:var(--card);border-radius:16px;padding:20px;width:90%;max-width:420px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(160,130,90,.15);animation:su .3s ease}
.mc2 h3{margin:0 0 16px;font-size:16px;font-weight:600;text-align:center}
.mc2 input,.mc2 textarea{width:100%;padding:10px 12px;border:1px solid var(--sep);border-radius:8px;margin-bottom:10px;font-size:13px;outline:0;background:#FDFCF9;color:var(--text)}
.mc2 textarea{resize:vertical;min-height:100px}
.mb{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.mb button{padding:10px 18px;border-radius:8px;border:0;font-size:14px;font-weight:600;cursor:pointer}
.mb .cn{background:var(--hb);color:var(--text)}
.mb .sv{background:var(--ac);color:#fff}
.fu{display:inline-block;background:var(--hb);color:var(--t2);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;border:1px dashed var(--sep);margin-bottom:10px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cc{border:1px solid var(--sep);background:var(--bg);border-radius:8px;padding:8px;min-height:65px;cursor:pointer}
.cc.active{border-color:var(--ac);background:var(--acs)}
.cd{font-size:18px;font-weight:700}
.cday{font-size:11px;color:var(--t2)}

<body>

    <div id="month-calendar" style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;"></div>

    <label class="ahb" style="background:#F4F0E8;color:var(--t2);border:1px solid var(--sep);cursor:pointer">📥 导入备份<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>

<div class="mo" id="list-modal"><div class="mc2"><h3>新建清单</h3><input type="text" id="list-name" placeholder="清单名称"><label class="fu">📁 上传 TXT / CSV 文件<input type="file" id="list-file-input" accept=".txt,.csv" onchange="handleFileUpload(this)" style="display:none"></label><textarea id="list-batch-items" placeholder="或直接粘贴（每行一个）"></textarea><div class="mb"><button class="cn" onclick="closeListModal()">取消</button><button class="sv" onclick="saveNewList()">创建</button></div></div></div>

    <!-- 使用 label 触发，保证 WebView 不会拦截 -->

<div class="mo tam" id="tag-action-modal"><div class="mc2"><h3>应用这张照片标签</h3><img id="tag-action-img" src="" alt=""><div style="font-size:13px;color:var(--t2);margin-bottom:12px">你想让这张图片应用在哪里？</div><div class="tsb"><button class="pr" onclick="applyTagScope('day')">仅应用于本日</button><button class="sc" onclick="applyTagScope('all')">应用于全部日期</button><button class="sc" onclick="closeTagActionModal()">取消</button></div></div></div>
<div id="rs"></div>
<script>
const SK='weekly-plan-book-v5',YK='vicky-planner-sync-config';
let db={tasks:[],notes:{},habits:[],weeklyHabits:[],summaries:{},lists:[],photos:{},globalPhotos:[],photoHistory:[]};
let currentMonday=getMonday(new Date()),currentWeekKey=getWeekKey(currentMonday);
let selectedDay=new Date().getDay()===0?6:new Date().getDay()-1,selectedTaskId=null;
let bookPeriod='day',bookDate=new Date();
let currentHabitTab='daily';
const HC=['#5C9A71','#D97736','#4F6BED','#8E44AD','#E74C3C','#1ABC9C','#F39C12','#3498DB','#9B59B6','#E67E22','#16A085','#2E4053','#C0392B','#27AE60'];
const CAT_NAMES={morning:'🌅 早晨',noon:'☀️ 中午',evening:'🌙 晚上'};
function getMonday(d){const x=new Date(d);x.setHours(0,0,0,0);const day=x.getDay();return new Date(x.setDate(x.getDate()-day+(day===0?-6:1)))}
function getWeekKey(m){const t=new Date(m);t.setDate(t.getDate()+3);const ys=new Date(t.getFullYear(),0,1);return t.getFullYear()+'-W'+String(Math.ceil(((t-ys)/864e5+1)/7)).padStart(2,'0')}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getDateForDay(i){const d=new Date(currentMonday);d.setDate(d.getDate()+i);return d}
function formatDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayKey(){const d=new Date();return getWeekKey(getMonday(d))+'-'+((d.getDay()+6)%7)}
function todayStr(){return formatDate(new Date())}

function renderNotice() {
  const board = document.getElementById('notice-card');
  const content = document.getElementById('notice-content');
  if (!board || !content) return;
  if (localStorage.getItem('vicky_notice_closed') === 'true') { board.style.display = 'none'; return; }
  const noticeHtml = `<b>欢迎使用！</b><br>这里是公告内容，支持 <b>加粗</b>、<i>斜体</i>、以及 <a href="#">超链接</a>。<br>你可以随时在代码中修改这段文字。`;
  content.innerHTML = noticeHtml;
}
function closeNotice() {
  const board = document.getElementById('notice-card');
  if (board) board.style.display = 'none';
  localStorage.setItem('vicky_notice_closed', 'true');
}

function saveLocal(){
  try { localStorage.setItem(SK,JSON.stringify(db)); } catch(e) {
    if (e.name === 'QuotaExceededError' || e.code === 22) { alert('⚠️ 存储空间已满！请删除不需要的照片标签。'); }
  }
}
function loadLocal(){
  try{
    const d=localStorage.getItem(SK);
    if(d)db=JSON.parse(d);
    ['tasks','habits','weeklyHabits','lists'].forEach(k=>{if(!db[k])db[k]=[]});
    ['notes','summaries','photos'].forEach(k=>{if(!db[k])db[k]={}});
    if(!db.globalPhotos)db.globalPhotos=[];
    if(!db.photoHistory)db.photoHistory=[];
    if (db.habits && db.habits.length > 0) { db.habits.forEach(h => { if (!h.category) h.category = 'morning'; }); }
    if (!db.weeklyHabits) db.weeklyHabits = [];
    const all=[];
    Object.keys(db.photos).forEach(k=>{(db.photos[k]||[]).forEach(p=>{if(!all.includes(p))all.push(p)})});
    (db.globalPhotos||[]).forEach(p=>{if(!all.includes(p))all.push(p)});
    all.forEach(p=>{if(!db.photoHistory.includes(p))db.photoHistory.push(p)});
    if(db.photoHistory.length>30)db.photoHistory=db.photoHistory.slice(0,30);
    saveLocal();
  }catch(e){
    db={tasks:[],notes:{},habits:[],weeklyHabits:[],summaries:{},lists:[],photos:{},globalPhotos:[],photoHistory:[]};
  }
}

function switchHabitTab(tab) {
  currentHabitTab = tab;
  document.querySelectorAll('.htab').forEach(t => t.classList.toggle('active', t.textContent.includes(tab==='daily'?'每日':'每周')));
  document.getElementById('habit-list').style.display = tab === 'daily' ? 'flex' : 'none';
  document.getElementById('weekly-habit-list').style.display = tab === 'weekly' ? 'flex' : 'none';
  document.getElementById('habit-add-btn').textContent = tab === 'daily' ? '+ 新建每日习惯' : '+ 新建每周习惯';
  renderHabits();
}

function addHabit() {
  if (currentHabitTab === 'daily') {
    const name = prompt('输入每日习惯名称（例如：喝水、背单词）：');
    if (!name || !name.trim()) return;
    const catInput = prompt('选择时间段 (填 1=早晨, 2=中午, 3=晚上)：\n默认早晨', '1');
    let category = 'morning';
    if (catInput === '2') category = 'noon';
    else if (catInput === '3') category = 'evening';
    db.habits.push({ id: 'habit-' + Date.now(), name: name.trim(), category, records: {}, remindTime: '' });
  } else {
    const name = prompt('输入每周习惯名称（例如：每周运动、大扫除）：');
    if (!name || !name.trim()) return;
    db.weeklyHabits.push({ id: 'wh-' + Date.now(), name: name.trim(), tasks: {}, records: {} });
  }
  saveLocal(); renderHabits();
}

function editWeeklyTaskText(habitId, dayIdx) {
  const h = db.weeklyHabits.find(x => x.id === habitId);
  if (!h) return;
  const currentText = h.tasks[dayIdx] || '';
  const val = prompt(`设置周${['一','二','三','四','五','六','日'][dayIdx]}的任务（留空则清除）：`, currentText);
  if (val === null) return;
  if (val.trim() === '') {
    delete h.tasks[dayIdx];
    const wk = getWeekKey(currentMonday);
    delete h.records[`${wk}-${dayIdx}`];
  } else {
    h.tasks[dayIdx] = val.trim();
  }
  saveLocal(); renderHabits();
}

function toggleHabitRecord(habitId, dateStr) {
  const h = db.habits.find(x => x.id === habitId);
  if (!h) return;
  if (h.records[dateStr] === 'done') delete h.records[dateStr];
  else h.records[dateStr] = 'done';
  saveLocal(); renderHabits(); renderBook(); 
  if (document.getElementById('day-detail-modal').classList.contains('show')) {
     openDayDetailModal(window._cdd);
  }
}

function cycleHabitRecord(habitId, dateStr) {
  const h = db.habits.find(x => x.id === habitId);
  if (!h) return;
  const v = h.records[dateStr];
  if (!v) h.records[dateStr] = 'makeup';
  else if (v === 'makeup') h.records[dateStr] = 'done';
  else delete h.records[dateStr];
  saveLocal(); renderHabits(); renderBook();
}

function toggleWeeklyTask(habitId, dayIdx) {
  const h = db.weeklyHabits.find(x => x.id === habitId);
  if (!h) return;
  const wk = getWeekKey(currentMonday);
  const key = `${wk}-${dayIdx}`;
  if (h.records[key] === 'done') delete h.records[key];
  else h.records[key] = 'done';
  saveLocal(); renderHabits(); renderBook();
  if (document.getElementById('day-detail-modal').classList.contains('show')) {
     openDayDetailModal(window._cdd);
  }
}

function deleteHabit(id, isWeekly) {
  if (!confirm('确定删除这个习惯？')) return;
  if (isWeekly) { db.weeklyHabits = db.weeklyHabits.filter(x => x.id !== id); }
  else { db.habits = db.habits.filter(x => x.id !== id); }
  saveLocal(); renderHabits(); renderBook();
}

function renderHabits() {
  if (currentHabitTab === 'daily') { renderDailyHabits(); }
  else { renderWeeklyHabits(); }
}

function renderDailyHabits() {
  const l = document.getElementById('habit-list');
  l.innerHTML = '';
  const todayS = todayStr();
  const totalHtml = buildOverallHeatmap();
  l.innerHTML += totalHtml;

  if (!db.habits.length) {
    l.innerHTML += '<div style="text-align:center;color:var(--t2);margin-top:20px">还没有每日习惯，点右上角新建一个吧！</div>';
    return;
  }

  const groups = { morning: [], noon: [], evening: [] };
  db.habits.forEach(h => {
    const cat = h.category || 'morning';
    if (groups[cat]) groups[cat].push(h);
  });

  ['morning', 'noon', 'evening'].forEach(cat => {
    const list = groups[cat];
    if (list.length === 0) return;
    let doneCount = list.filter(h => h.records[todayS] === 'done').length;
    let titleHtml = `<div class="group-title">${CAT_NAMES[cat]} <span>(${doneCount}/${list.length})</span></div>`;
    l.innerHTML += titleHtml;

    list.forEach((h, idx) => {
      const c = document.createElement('div');
      c.className = 'hc';
      const bc = HC[idx % HC.length];
      let hm = '';
      const cm = getMonday(new Date());
      const td = new Date();
      for (let w = 16; w >= 0; w--) {
        const ws = new Date(cm); ws.setDate(ws.getDate() - w * 7);
        for (let j = 0; j < 7; j++) {
          const dt = new Date(ws); dt.setDate(dt.getDate() + j);
          const ds = formatDate(dt);
          if (dt > td) hm += '<div class="hm fu"></div>';
          else {
            const v = h.records[ds];
            let sty = '';
            if (v === 'done') sty = `background:${bc};`;
            else if (v === 'makeup') sty = `background:${bc};opacity:.4;`;
            hm += `<div class="hm" style="${sty}" onclick="cycleHabitRecord('${h.id}','${ds}')" title="${ds}"></div>`;
          }
        }
      }
      const ck = h.records[todayS] === 'done';
      const bt = ck ? '✅ 已打卡' : '⭕ 今日打卡';
      c.innerHTML = `
        <div class="ht2"><span class="hn">${esc(h.name)}</span><div class="htr"><span class="hs">${CAT_NAMES[cat]}</span></div></div>
        <div class="hmc"><div class="hmg">${hm}</div></div>
        <div class="hf"><button class="cib ${ck?'ck':''}" onclick="toggleHabitRecord('${h.id}','${todayS}')">${bt}</button><div class="ha"><button onclick="deleteHabit('${h.id}', false)">删除</button></div></div>
      `;
      l.appendChild(c);
    });
  });
}

function buildOverallHeatmap() {
  const td = new Date();
  const cm = getMonday(td);
  let hm = '';
  for (let w = 16; w >= 0; w--) {
    const ws = new Date(cm); ws.setDate(ws.getDate() - w * 7);
    for (let j = 0; j < 7; j++) {
      const dt = new Date(ws); dt.setDate(dt.getDate() + j);
      const ds = formatDate(dt);
      if (dt > td) hm += '<div class="hm fu"></div>';

function renderWeeklyHabits() {
  const l = document.getElementById('weekly-habit-list');
  l.innerHTML = '';
  if (!db.weeklyHabits.length) {
    l.innerHTML = '<div style="text-align:center;color:var(--t2);margin-top:40px">还没有每周习惯，点右上角新建一个吧！</div>';
    return;
  }
  const wk = getWeekKey(currentMonday);
  const dn = ['周一','周二','周三','周四','周五','周六','周日'];
  db.weeklyHabits.forEach((h, idx) => {
    const c = document.createElement('div');
    c.className = 'hc';
    const bc = HC[idx % HC.length];
    let hm = '';
    const cm = getMonday(new Date());
    const td = new Date();
    for (let w = 16; w >= 0; w--) {
      const ws = new Date(cm); ws.setDate(ws.getDate() - w * 7);
      const weekKey = getWeekKey(ws);
      const taskDays = Object.keys(h.tasks);
      const allDone = taskDays.length > 0 && taskDays.every(day => h.records[weekKey + '-' + day] === 'done');
      for (let j = 0; j < 7; j++) {
        const dt = new Date(ws); dt.setDate(dt.getDate() + j);
        if (dt > td) hm += '<div class="hm fu"></div>';
        else {
          let sty = allDone ? `background:${bc};` : '';
          hm += `<div class="hm" style="${sty}" title="${weekKey}"></div>`;
        }
      }
    }
    let tasksHtml = '';
    for (let i = 0; i < 7; i++) {
      const taskText = h.tasks[i];
      const key = `${wk}-${i}`;
      const isDone = h.records[key] === 'done';
      if (taskText) {
        tasksHtml += `<div class="wt-row">
          <span class="wt-day">${dn[i]}</span>
          <span class="wt-task" onclick="editWeeklyTaskText('${h.id}', ${i})">${esc(taskText)}</span>
          <button class="wt-btn ${isDone ? 'done' : ''}" onclick="toggleWeeklyTask('${h.id}', ${i})">${isDone ? '✔ 完成' : '打卡'}</button>
        </div>`;
      } else {
        tasksHtml += `<div class="wt-row">
          <span class="wt-day">${dn[i]}</span>
          <span class="wt-task empty">休息</span>
          <button class="wt-btn add" onclick="editWeeklyTaskText('${h.id}', ${i})">+ 添加</button>
        </div>`;
      }
    }
    c.innerHTML = `
      <div class="ht2"><span class="hn">${esc(h.name)}</span><div class="ha"><button onclick="deleteHabit('${h.id}', true)">删除</button></div></div>
      <div class="hmc"><div class="hmg">${hm}</div></div>
      <div class="hml"><span class="sw" style="background:${bc}"></span><span>整周任务全部完成时点亮</span></div>
      <div style="margin-top:8px;border-top:1px solid var(--sep);padding-top:8px;"><div style="font-size:12px;font-weight:700;color:var(--ac);margin-bottom:4px;">本周任务 (${wk})</div>${tasksHtml}</div>
    `;
    l.appendChild(c);
  });
}

// ✅ 重构：日期详情弹窗，包含任务、习惯、照片、心得
function openDayDetailModal(d){
  window._cdd=new Date(d);
  const wk=getWeekKey(getMonday(d)),di=(d.getDay()+6)%7,nk=`${wk}-${di}`, ds=formatDate(d);
  
  document.getElementById('day-detail-title').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 详情`;
  
  // 1. 渲染习惯
  const hc = document.getElementById('day-detail-habits');
  hc.innerHTML = '';
  let habitsHtml = '';
  
  // 每日习惯
  db.habits.forEach(h => {
    const ck = h.records[ds] === 'done';
    habitsHtml += `<div style="display:inline-block; margin:0 8px 8px 0;">
      <button onclick="toggleHabitRecord('${h.id}', '${ds}')" style="background:${ck?'var(--sc)':'var(--hb)'}; color:${ck?'#fff':'var(--t2)'}; border:1px solid var(--sc); border-radius:12px; padding:4px 10px; font-size:12px; font-weight:600; cursor:pointer;">
        ${ck ? '✅' : '⭕'} ${esc(h.name)}
      </button>
    </div>`;
  });
  // 每周习惯
  db.weeklyHabits.forEach(h => {
    if (h.tasks[di]) {
      const ck = h.records[`${wk}-${di}`] === 'done';
      habitsHtml += `<div style="display:inline-block; margin:0 8px 8px 0;">
        <button onclick="toggleWeeklyTask('${h.id}', ${di})" style="background:${ck?'var(--ac)':'var(--hb)'}; color:${ck?'#fff':'var(--t2)'}; border:1px solid var(--ac); border-radius:12px; padding:4px 10px; font-size:12px; font-weight:600; cursor:pointer;">
          ${ck ? '✅' : '⭕'} [周习惯] ${esc(h.tasks[di])}
        </button>
      </div>`;
    }
  });
  hc.innerHTML = habitsHtml || '<div style="color:var(--t3);font-size:12px;margin-bottom:8px;">这一天没有设置习惯</div>';

  // 2. 渲染任务
  const dt=db.tasks.filter(t=>t.week_key===wk&&t.day===di);
  const te=document.getElementById('day-detail-tasks');
  if(dt.length===0){
    te.innerHTML='<div style="color:var(--t3);font-size:12px;">无任务</div>';
  }else{
    te.innerHTML=dt.map(t=>`<div>${t.done?'✅':'⭕'} <span style="${t.done?'text-decoration:line-through;color:var(--t3);':''}">${esc(t.title)}</span></div>`).join('');
  }

  // 3. 渲染心得
  const nt=db.notes[nk]||'';
  document.getElementById('day-detail-note-display').textContent=nt.trim()?nt:'暂无心得';

  // 4. 渲染照片
  renderDayPhotos(d);
  renderPhotoHistory();
  
  document.getElementById('day-detail-modal').classList.add('show');
}

function renderDaySummary(){const c=document.getElementById('month-calendar');c.innerHTML='';const y=bookDate.getFullYear(),m=bookDate.getMonth();const fd=new Date(y,m,1),fw=(fd.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),pmd=new Date(y,m,0).getDate();const inner=document.createElement('div');inner.className='mc';inner.style.cssText='width:100%;height:100%;';const wd=document.createElement('div');wd.className='mw';['一','二','三','四','五','六','日'].forEach(n=>{const el=document.createElement('div');el.className='mwd';el.textContent='周'+n;wd.appendChild(el)});inner.appendChild(wd);const g=document.createElement('div');g.className='mdg';for(let i=0;i<42;i++){let cd,om=false;if(i<fw){const day=pmd-fw+i+1;cd=new Date(y,m-1,day);om=true}else if(i<fw+dim){const day=i-fw+1;cd=new Date(y,m,day)}else{const day=i-fw-dim+1;cd=new Date(y,m+1,day);om=true}const ds=formatDate(cd),wk=getWeekKey(getMonday(cd)),di=(cd.getDay()+6)%7,nk=`${wk}-${di}`;const it=ds===formatDate(new Date());const cell=document.createElement('div');cell.className='mdc'+(om?' om':'')+(it?' td':'');const hd=document.createElement('div');hd.className='mdh';const num=document.createElement('span');num.className='mdn';num.textContent=cd.getDate();hd.appendChild(num);const ps=db.photos[nk]||[],gp=db.globalPhotos||[],ap=[...ps,...gp];if(ap.length>0){const pe=document.createElement('div');pe.className='mdp';const im=document.createElement('img');im.src=ap[0];im.className='mdph';pe.appendChild(im);hd.appendChild(pe)}cell.appendChild(hd);const te=document.createElement('div');te.className='mdt';const dt=db.tasks.filter(t=>t.week_key===wk&&t.day===di);dt.slice(0,4).forEach(t=>{const tel=document.createElement('div');tel.className='mt '+(t.done?'dn':'pd');tel.textContent=t.title;tel.title=t.title;te.appendChild(tel)});if(dt.length>4){const mo=document.createElement('div');mo.className='mm';mo.textContent=`+${dt.length-4} 个任务`;te.appendChild(mo)}cell.appendChild(te);cell.onclick=()=>openDayDetailModal(cd);g.appendChild(ce function renderWeekSummary(){const c=document.getElementById('month-calendar');c.innerHTML='';const ws=getMonday(bookDate),wk=getWeekKey(ws),wn=wk.split('-W')[1];const dn=['周一','周二','周三','周四','周五','周六','周日'];const v=document.createElement('div');v.className='wsv';const t=document.createElement('div');t.className='wst';t.innerHTML=`第 ${wn} 周 <span class="ar">▸</span>`;t.onclick=()=>openWeekDetailModal();v.appendChild(t);const l=document.createElement('div');l.className='wdl';for(let i=0;i<7;i++){const cd=new Date(ws);cd.setDate(cd.getDate()+i);const dk=`${wk}-${i}`,it=formatDate(cd)===formatDate(new Date());const r=document.createElement('div');r.className='wdr'+(it?' td':'');const de=document.createElement('div');de.className='wdd';de.innerHTML=`${dn[i]}<span class="wdn">${cd.getMonth()+1}/${cd.getDate()}</span>`;r.appendChild(de);const pe=document.createElement('div');pe.className='wdp';const ap=[...(db.photos[dk]||[]),...(db.globalPhotos||[])];if(ap.length===0)pe.innerHTML='<span class="wdpe">—</span>';else ap.slice(0,2).forEach(p=>{const im=document.createElement('img');im.src=p;im.className='wdph';pe.appendChild(im)});r.appendChild(pe);const te=document.createElement('div');te.className='wdt';const dt=db.tasks.filter(t=>t.week_key===wk&&t.day===i);if(dt.length===0)te.innerHTML='<span class="wdte">无任务</span>';else dt.forEach(t=>{const tg=document.createElement('span');tg.className='wdtg'+(t.done?' dn':'');tg.textContent=t.title;te.appendChild(tg)});r.appendChild(te);r.onclick=()=>openDayDetailModal(cd);l.appendChild(r)}v.appendChild(l);c.appendChild(v)}
function renderMonthSummary(){const c=document.getElementById('month-calendar');c.innerHTML='';const v=document.createElement('div');v.className='mwv';const y=bookDate.getFullYear(),m=bookDate.getMonth(),ms=new Date(y,m,1),me=new Date(y,m+1,0);const wks=[];let cur=getMonday(ms);while(cur<=me){const wk=getWeekKey(cur);if(!wks.includes(wk))wks.push(wk);cur.setDate(cur.getDate()+7)}const dn=['周一','周二','周三','周四','周五','周六','周日'];wks.forEach(wk=>{const wn=wk.split('-W')[1],yy=parseInt(wk.split('-W')[0]),ys=new Date(yy,0,1);let ws=getMonday(ys);ws.setDate(ws.getDate()+(parseInt(wn)-1)*7);const we=new Date(ws);we.setDate(we.getDate()+6);const bl=document.createElement('div');bl.className='mwb';bl.innerHTML=`<div class="mwh"><span>第 ${wn} 周</span><span class="rg">${ws.getMonth()+1}/${ws.getDate()} - ${we.getMonth()+1}/${we.getDate()}</span></div>`;const dw=document.createElement('div');dw.className='mwds';for(let i=0;i<7;i++){const cd=new Date(ws);cd.setDate(cd.getDate()+i);const dt=db.tasks.filter(t=>t.week_key===wk&&t.day===i);const dc=dt.filter(t=>t.done).length;const re=document.createElement('div');re.className='mwdr';re.innerHTML=`<span>${dn[i]} ${cd.getMonth()+1}/${cd.getDate()}</span><span class="dc${dc===0?' z':''}">${dc}/${dt.length}</span>`;dw.appendChild(re)}bl.appendChild(dw);bl.onclick=()=>{bookPeriod='week';bookDate=new Date(ws);document.querySelectorAll('.bt button').forEach(b=>b.classList.toggle('active',b.dataset.period==='week'));renderBook()};v.appendChild(bl)});c.appendChild(v)}
function renderYearSummary(){const c=document.getElementById('month-calendar');c.innerHTML='';const y=bookDate.getFullYear();const v=document.createElement('div');v.className='ysv';const t=document.createElement('div');t.className='yst';t.innerHTML=`${y}年 <span class="ar">▸</span>`;t.onclick=()=>openYearDetailModal();v.appendChild(t);const g=document.createElement('div');g.className='yg';for(let m=0;m<12;m++){const ms=new Date(y,m,1),me=new Date(y,m+1,0);const mt=db.tasks.filter(t=>{if(!t.week_key||t.day===null||t.day===undefined)return false;const fm=getMonday(new Date(y,m,1)),lm=getMonday(me);const c2=new Date(fm);while(c2<=lm){const tg=new Date(c2);tg.setDate(tg.getDate()+Number(t.day));if(tg>=ms&&tg<=me&&getWeekKey(c2)===t.week_key)return true;c2.setDate(c2.getDate()+7)}return false});const dc=mt.filter(t=>t.done).length;const cd=document.createElement('div');cd.className='ymc';cd.innerHTML=`<div class="ymn">${m+1}月</div><div class="ymct">${dc}/${mt.length}</div>`;cd.onclick=()=>{bookPeriod='month';bookDate=new Date(y,m,1);document.querySelectorAll('.bt button').forEach(b=>b.classList.toggle('active',b.dataset.period==='month'));renderBook()};g.appendChild(cd)}v.appendChild(g);c.appendChild(v)}
function renderBook() {
  const le=document.getElementById('book-period-label'),bl=getPeriodLabel();
  le.onclick=null;le.style.cursor='default';le.style.color='';
  
  if(bookPeriod==='day') {
    le.textContent=bl;
    document.getElementById('book-period-sub').textContent='日历 · 点击日期查看详情';
    renderDaySummary();
    document.getElementById('book-bottom-title').textContent='今日心得';
    document.getElementById('book-summary-input').value=db.notes[todayKey()]||'';
  }
  else if(bookPeriod==='week') {
    le.textContent=bl;
    document.getElementById('book-period-sub').textContent='点击上方"第xx周"查看该周总结';
    renderWeekSummary();
    const wk=getWeekKey(getMonday(bookDate));
    document.getElementById('book-bottom-title').textContent=`第 ${wk.split('-W')[1]} 周心得`;
    document.getElementById('book-summary-input').value=db.summaries['week-'+wk]||'';
  }
  else if(bookPeriod==='month') {
    le.textContent=bl+' ▸';le.style.cursor='pointer';le.style.color='var(--ac)';le.onclick=()=>openMonthDetailModal();
    document.getElementById('book-period-sub').textContent='点击上方标题查看本月心得';
    renderMonthSummary();
    const mk=bookDate.getFullYear()+'-'+String(bookDate.getMonth()+1).padStart(2,'0');
    document.getElementById('book-bottom-title').textContent=`${bookDate.getFullYear()}年${bookDate.getMonth()+1}月心得`;
    document.getElementById('book-summary-input').value=db.summaries['month-'+mk]||'';
  }
  else {
    le.textContent=bl;
    document.getElementById('book-period-sub').textContent='点击"202x年"查看全年总结';
    renderYearSummary();
    document.getElementById('book-bottom-title').textContent=`${bookDate.getFullYear()}年心得`;
    document.getElementById('book-summary-input').value=db.summaries['year-'+bookDate.getFullYear()]||'';
  }
  document.getElementById('book-period-label-bottom').textContent=bl;
}
function saveBookSummary(){const t=document.getElementById('book-summary-input').value;if(bookPeriod==='day')db.notes[todayKey()]=t;else if(bookPeriod==='week')db.summaries['week-'+getWeekKey(getMonday(bookDate))]=t;else if(bookPeriod==='month')db.summaries['month-'+bookDate.getFullYear()+'-'+String(bookDate.getMonth()+1).padStart(2,'0')]=t;else db.summaries['year-'+bookDate.getFullYear()]=t;saveLocal();alert('已保存！')}
