<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VickyLog</title>
<style>
/* 样式部分与之前完全一致，保持不变 */
:root{--bg:#FDFBF7;--card:#FFFDFA;--text:#3A322B;--t2:#8C8279;--t3:#C2B8A3;--ac:#D97736;--acs:#FDF3E8;--dg:#D9534F;--sc:#5C9A71;--hb:#F4F0E8;--sep:#EFE9DF;--rc:10px;--rb:8px;--sh:0 1px 6px rgba(160,130,90,.04)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit}
header{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--sep);z-index:10}
.ht{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px}
.tabs{display:flex;background:var(--hb);border-radius:var(--rb);padding:3px;flex:1;max-width:340px}
.tab{flex:1;padding:6px 0;text-align:center;border-radius:6px;background:0;color:var(--t2);border:0;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sbh{background:var(--ac);color:#fff;border:0;border-radius:var(--rb);padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.hb2{text-align:center;font-size:13px;font-weight:600;color:var(--text)}
.view{flex:1;display:none;overflow:hidden;padding:4px;gap:4px}
.view.active{display:flex}
#view-plan{flex-direction:row}
.lp{width:33.33%;flex:none;display:flex;flex-direction:column;overflow-y:auto;background:var(--card);border-radius:var(--rc);box-shadow:var(--sh)}
.dg{display:flex;flex-direction:column;border-bottom:1px solid var(--sep)}
.dg:last-child{border-bottom:0}
.dh{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 8px 6px;cursor:pointer}
.dh.active{background:var(--acs);border-left:3px solid var(--ac)}
.dn{font-size:22px;font-weight:700;line-height:1.1}
.dm{font-size:14px;font-weight:600;color:var(--t2)}
.tl{padding:0 2px 8px;display:flex;flex-direction:column}
.ti{display:flex;align-items:flex-start;gap:4px;padding:4px;border-radius:6px;cursor:pointer}
.ti.active{background:var(--acs)}
.ti .chk{width:14px;height:14px;border-radius:50%;border:2px solid var(--t3);background:var(--card);flex:none;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;margin-top:3px}
.ti.done .chk{background:var(--ac);border-color:var(--ac)}
.ti.done .chk::after{content:'';width:3px;height:6px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(45deg) translate(-1px,-1px)}
.tc{flex:1;min-width:0;display:flex;flex-direction:column}
.ti .ttl{font-size:12px;word-break:break-word;line-height:1.4;user-select:none;font-weight:500}
.tp{font-size:10px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
.ti.done .ttl{color:var(--t3);text-decoration:line-through}
.ti.done .tp{text-decoration:line-through;opacity:.5}
.rp{flex:1;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.rc{background:var(--card);border-radius:var(--rc);padding:12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px}
.it{font-size:12px;font-weight:600;color:var(--ac);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.iir{display:flex;gap:4px}
.iir input{flex:1;border:1px solid var(--sep);border-radius:6px;padding:6px 8px;font-size:12px;outline:0;background:var(--bg);color:var(--text);min-width:0}
.iir button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:0 10px;font-size:14px;cursor:pointer}
.iti{display:flex;align-items:flex-start;gap:6px;padding:6px 0;border-bottom:1px solid var(--sep);font-size:12px}
.iti:last-child{border-bottom:0}
.iti .chk{margin-top:2px}
.iti .tc{flex:1;min-width:0}
.iti .ttl{font-size:12px;word-break:break-word;line-height:1.4;font-weight:500}
.iti .tp{font-size:10px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iti select{font-size:11px;border:1px solid var(--sep);border-radius:4px;background:var(--card);color:var(--t2);outline:0;max-width:60px;margin-top:2px}
.ntc .ct{font-size:13px;font-weight:600;margin-bottom:6px}
.ntf{display:flex;flex-direction:column;gap:8px}
.ntf input,.ntf textarea{width:100%;border:1px solid var(--sep);border-radius:6px;padding:8px 10px;font-size:12px;outline:0;background:var(--bg);color:var(--text)}
.ntf textarea{resize:vertical;min-height:50px}
.ntf input:focus,.ntf textarea:focus{border-color:var(--ac);background:var(--card)}
.fr{display:flex;gap:6px;align-items:center}
.fr input[type=datetime-local]{flex:1}
.addb{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
.hint{font-size:10px;color:var(--t3);margin-top:-2px}
.dhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.dtt{font-weight:600;font-size:14px}
.ddt{font-size:12px;color:var(--t2)}
.tda{background:#FDFCF9;border:1px solid var(--sep);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.tda .tr input{width:100%;border:0;border-bottom:1px solid var(--sep);font-size:14px;font-weight:600;background:0;outline:0;padding-bottom:4px;color:var(--text)}
.tda .tmr input{width:100%;border:0;font-size:12px;background:0;outline:0;color:var(--t2)}
.tda .dr textarea{width:100%;border:1px solid var(--sep);border-radius:6px;padding:8px;font-size:12px;resize:vertical;outline:0;min-height:60px;background:var(--card);color:var(--text)}
.tact{display:flex;gap:6px;margin-top:4px}
.tact button{padding:8px 12px;border-radius:6px;border:0;font-size:12px;font-weight:600;cursor:pointer}
.delb{background:#FDE8E8;color:var(--dg)}
.savb{background:var(--ac);color:#fff;flex:1}
.nst{color:var(--t3);font-size:12px;padding:8px 0;text-align:center}
.rf{background:var(--card);border-radius:var(--rc);padding:10px;box-shadow:var(--sh);display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.rf button{background:var(--hb);color:var(--ac);border:0;border-radius:var(--rb);padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.rf .wd{font-size:13px;font-weight:600;cursor:pointer;padding:4px 12px;border-radius:6px;background:var(--acs)}
#view-book{flex-direction:column;gap:8px}
.bt{display:flex;gap:4px;justify-content:center;flex:none}
.bt button{background:var(--hb);color:var(--t2);border:0;border-radius:16px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer}
.bt button.active{background:var(--ac);color:#fff}
.bkt{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border-radius:var(--rc);box-shadow:var(--sh);overflow:hidden}
.bkb{flex:0 0 135px;display:flex;flex-direction:column;background:var(--card);border-radius:var(--rc);box-shadow:var(--sh);padding:8px 10px;min-height:110px}
.bbt{font-size:12px;font-weight:600;color:var(--ac);margin-bottom:4px;flex:none}
.bba{display:flex;justify-content:flex-end;margin-top:4px;flex:none}
.bba button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer}
.chb{padding:10px 12px;border-bottom:1px solid var(--sep);background:#FDFCF9;display:flex;justify-content:space-between;align-items:center;flex:none}
.chb h3{margin:0;font-size:15px;font-weight:600}
.chb p{margin:0;font-size:12px;color:var(--t2)}
.mc{flex:1;min-height:0;display:flex;flex-direction:column;padding:4px;overflow:hidden;background:var(--card)}
.mw{flex:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-bottom:2px}
.mwd{text-align:center;padding:4px 0;font-size:11px;font-weight:600;color:var(--t2)}
.mdg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:2px}
.mdc{min-width:0;min-height:0;border:1px solid var(--sep);border-radius:6px;background:var(--bg);padding:4px;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;position:relative}
.mdc:active{background:var(--acs)}
.mdc.om{opacity:.35;background:#F8F6F1}
.mdc.td{background:var(--acs);border-color:var(--ac)}
.mdh{display:flex;justify-content:space-between;align-items:center;flex:none;min-height:22px}
.mdn{font-size:13px;font-weight:700}
.mdc.td .mdn{color:var(--ac)}
.mdp{display:flex;gap:2px;align-items:center}
.mdph{width:22px;height:22px;object-fit:cover;border-radius:4px;border:1px solid rgba(0,0,0,.06);flex:none}
.mdt{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px;margin-top:3px}
.mt{font-size:9px;line-height:1.3;padding:2px 3px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt.pd{background:var(--acs);color:var(--ac);border-left:2px solid var(--ac)}
.mt.dn{background:#F0F0F0;color:var(--t3);text-decoration:line-through}
.mm{font-size:8px;color:var(--t2);text-align:center}
.wsv{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--card)}
.wst{flex:none;font-size:16px;font-weight:700;color:var(--ac);text-align:center;padding:10px;cursor:pointer;border-bottom:1px solid var(--sep);display:flex;align-items:center;justify-content:center;gap:6px}
.wst .ar{font-size:12px;color:var(--t3)}
.wdl{flex:1;min-height:0;overflow-y:auto;padding:4px}
.wdr{display:flex;gap:6px;padding:6px 4px;border-bottom:1px solid var(--sep);align-items:stretch;cursor:pointer;min-height:56px}
.wdr:last-child{border-bottom:0}
.wdr.td{background:var(--acs);border-radius:6px}
.wdd{width:52px;flex:none;font-size:12px;font-weight:600;line-height:1.4}
.wdn{display:block;font-size:10px;color:var(--t2);font-weight:500;margin-top:2px}
.wdp{width:100px;flex:none;display:flex;gap:3px;align-items:center}
.wdph{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none;border:1px solid rgba(0,0,0,.06)}
.wdpe{font-size:11px;color:var(--t3)}
.wdt{flex:1;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;min-width:0}
.wdtg{font-size:11px;padding:2px 6px;background:var(--acs);color:var(--ac);border-radius:4px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.wdtg.dn{background:#F0F0F0;color:var(--t3);text-decoration:line-through}
.wdte{font-size:11px;color:var(--t3)}
.mwv{flex:1;min-height:0;overflow-y:auto;padding:6px}
.mwb{border:1px solid var(--sep);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--bg);cursor:pointer}
.mwb:active{background:var(--acs);border-color:var(--ac)}
.mwh{font-size:13px;font-weight:700;color:var(--ac);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.mwh .rg{font-size:11px;font-weight:500;color:var(--t2)}
.mwds{display:flex;flex-direction:column;gap:3px}
.mwdr{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:2px 0}
.mwdr .dc{font-weight:600;color:var(--ac)}
.mwdr .dc.z{color:var(--t3);font-weight:500}
.ysv{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--card)}
.yst{flex:none;font-size:18px;font-weight:700;color:var(--ac);text-align:center;padding:12px;cursor:pointer;border-bottom:1px solid var(--sep);display:flex;align-items:center;justify-content:center;gap:6px}
.yst .ar{font-size:12px;color:var(--t3)}
.yg{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px}
.ymc{background:var(--bg);border:1px solid var(--sep);border-radius:8px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;aspect-ratio:1}
.ymc:active{background:var(--acs);border-color:var(--ac)}
.ymn{font-size:16px;font-weight:700}
.ymct{font-size:11px;color:var(--t2);margin-top:4px}
.ddb{padding:8px 0;border-bottom:1px dashed var(--sep)}
.ddb:last-child{border-bottom:0}
.ddh{font-size:13px;font-weight:600;color:var(--ac);margin-bottom:4px}
.dtl{display:flex;flex-direction:column;gap:2px}
.dtk{font-size:12px;line-height:1.5;display:flex;gap:4px}
.dtk.dn{color:var(--t3);text-decoration:line-through}
.dtk .mk{flex:none}
.dnt{min-height:40px;padding:10px;background:var(--bg);border-radius:8px;font-size:13px;line-height:1.6;white-space:pre-wrap;margin-bottom:12px}
.bsta{flex:1;width:100%;border:1px solid var(--sep);border-radius:8px;background:var(--bg);font-size:13px;resize:none;outline:0;line-height:1.6;padding:8px;min-height:40px}
.bsta:focus{border-color:var(--ac);background:var(--card)}
.bnv{display:flex;justify-content:space-between;align-items:center;padding:4px 0;flex:none}
.bnv button{background:var(--hb);color:var(--ac);border:0;border-radius:var(--rb);padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
#view-habits{flex-direction:column;gap:0}
.hh{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 12px}
.hh h2{margin:0;font-size:18px;font-weight:600}
.ahb{background:var(--ac);color:#fff;border:0;border-radius:var(--rb);padding:6px 14px;cursor:pointer;font-size:13px;font-weight:600}
.hl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:20px}
.hc{background:var(--card);border-radius:var(--rc);padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
.ht2{display:flex;justify-content:space-between;align-items:center}
.hn{font-weight:600;font-size:16px}
.hs{font-size:12px;color:var(--ac);background:#FEF3E2;padding:3px 8px;border-radius:10px;font-weight:500}
.hmc{overflow-x:auto;padding-bottom:6px}
.hmg{display:grid;grid-template-rows:repeat(7,16px);grid-auto-flow:column;grid-auto-columns:16px;gap:3px;padding-bottom:2px}
.hm{width:16px;height:16px;border-radius:4px;background:var(--hb);cursor:pointer}
.hm.fu{background:0;cursor:default}
.hml{display:flex;gap:8px;font-size:10px;color:var(--t2);padding:4px 0 0;align-items:center}
.hml .sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.hf{display:flex;justify-content:space-between;align-items:center}
.ha button{background:0;border:0;color:var(--t2);cursor:pointer;font-size:12px}
.cib{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
.cib.ck{background:var(--hb);color:var(--t2)}
.htr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hrb{background:var(--hb);color:var(--t2);border:0;border-radius:12px;padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.hrb.on{background:var(--acs);color:var(--ac)}
#view-lists{flex-direction:column;gap:8px;overflow-y:auto;padding:8px}
.lh{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 8px}
.lh h2{margin:0;font-size:18px;font-weight:600}
.lg{display:grid;grid-template-columns:1fr;gap:10px;padding-bottom:20px}
.lc{background:var(--card);border-radius:var(--rc);padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}
.lch{display:flex;justify-content:space-between;align-items:center}
.lct{font-weight:600;font-size:15px}
.lca button{background:0;border:0;color:var(--t2);cursor:pointer}
.lp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2)}
.pb{flex:1;height:5px;background:#F0ECE3;border-radius:3px;overflow:hidden}
.pf{height:100%;background:var(--ac);border-radius:3px}
.li{display:flex;flex-direction:column;max-height:220px;overflow-y:auto}
.lit{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--sep);font-size:13px}
.lit:last-child{border-bottom:0}
.csq{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--t3);background:var(--card);flex:none;cursor:pointer;padding:0}
.lit.dn .csq{background:var(--sc);border-color:var(--sc)}
.lit.dn .csq::after{content:'';display:block;width:3px;height:6px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(45deg) translate(-1px,-1px)}
.lit.dn .ttl{color:var(--t3);text-decoration:line-through}
.atr{display:flex;gap:5px}
.atr input{flex:1;min-width:0;border:1px solid var(--sep);border-radius:6px;padding:6px 8px;background:var(--bg);outline:0;font-size:12px}
.atr button{width:32px;border:0;border-radius:6px;background:var(--ac);color:#fff;font-size:18px}
.mo{position:fixed;inset:0;background:rgba(58,50,43,.3);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center}
.mo.show{display:flex}
@keyframes su{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.mc2{background:var(--card);border-radius:16px;padding:20px;width:90%;max-width:420px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(160,130,90,.15);animation:su .3s ease}
.mc2 h3{margin:0 0 16px;font-size:16px;font-weight:600;text-align:center}
.mc2 input,.mc2 textarea{width:100%;padding:10px 12px;border:1px solid var(--sep);border-radius:8px;margin-bottom:10px;font-size:13px;outline:0;background:#FDFCF9;color:var(--text)}
.mc2 textarea{resize:vertical;min-height:100px}
.mb{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.mb button{padding:10px 18px;border-radius:8px;border:0;font-size:14px;font-weight:600;cursor:pointer}
.mb .cn{background:var(--hb);color:var(--text)}
.mb .sv{background:var(--ac);color:#fff}
.fu{display:inline-block;background:var(--hb);color:var(--t2);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;border:1px dashed var(--sep);margin-bottom:10px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cc{border:1px solid var(--sep);background:var(--bg);border-radius:8px;padding:8px;min-height:65px;cursor:pointer}
.cc.active{border-color:var(--ac);background:var(--acs)}
.cd{font-size:18px;font-weight:700}
.cday{font-size:11px;color:var(--t2)}
.cbg{margin-top:4px;display:flex;gap:3px;flex-wrap:wrap}
.bdg{font-size:8px;padding:2px 4px;border-radius:4px}
.bdg.task{background:var(--acs);color:var(--ac)}
.bdg.note{background:#EAF4ED;color:var(--sc)}
.ddp{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.pth{width:68px;height:68px;border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid var(--sep)}
.pth img{width:100%;height:100%;object-fit:cover}
.phs{display:flex;gap:8px;overflow-x:auto;padding:6px 0;min-height:60px}
.phi{flex:none;width:52px;height:52px;border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid var(--sep);background:var(--bg);position:relative}
.phi img{width:100%;height:100%;object-fit:cover}
.phe{font-size:12px;color:var(--t3);padding:8px 0}
.dh2{position:absolute;top:2px;right:2px;width:18px;height:18px;background:rgba(0,0,0,.5);color:#fff;border:0;border-radius:50%;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.crp{display:flex;flex-direction:column;align-items:center;gap:10px}
.crb{width:374px;max-width:90%;aspect-ratio:1/1;border:2px dashed var(--ac);border-radius:8px;overflow:hidden;position:relative;background:#fff;touch-action:none}
.crb img{position:absolute;max-width:none;display:block;cursor:move;user-select:none;-webkit-user-drag:none}
.crc{display:flex;align-items:center;gap:10px;width:100%}
.crc label{font-size:12px;color:var(--t2)}

<script>
const SK='weekly-plan-book-v5',YK='vicky-planner-sync-config';
let db={tasks:[],notes:{},habits:[],summaries:{},lists:[],photos:{},globalPhotos:[],photoHistory:[],reminderState:{tasks:{},habits:{},habitSnooze:{}}};
let currentMonday=getMonday(new Date()),currentWeekKey=getWeekKey(currentMonday);
let selectedDay=new Date().getDay()===0?6:new Date().getDay()-1,selectedTaskId=null;
let bookPeriod='day',bookDate=new Date();
const HC=['#5C9A71','#D97736','#4F6BED','#8E44AD','#E74C3C','#1ABC9C','#F39C12','#3498DB','#9B59B6','#E67E22','#16A085','#2E4053','#C0392B','#27AE60'];
function getMonday(d){const x=new Date(d);x.setHours(0,0,0,0);const day=x.getDay();return new Date(x.setDate(x.getDate()-day+(day===0?-6:1)))}
function getWeekKey(m){const t=new Date(m);t.setDate(t.getDate()+3);const ys=new Date(t.getFullYear(),0,1);return t.getFullYear()+'-W'+String(Math.ceil(((t-ys)/864e5+1)/7)).padStart(2,'0')}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getDateForDay(i){const d=new Date(currentMonday);d.setDate(d.getDate()+i);return d}
function formatDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayKey(){const d=new Date();return getWeekKey(getMonday(d))+'-'+((d.getDay()+6)%7)}
function todayStr(){return formatDate(new Date())}
function ensureRS(){if(!db.reminderState)db.reminderState={};['tasks','habits','habitSnooze'].forEach(k=>{if(!db.reminderState[k])db.reminderState[k]={}})}

// 诊断工具
async function diagnoseNotification(){
  if (!("Notification" in window)) {
    alert('❌ 当前环境不支持网页通知 (new Notification)。\n请检查 WebToApp 是否开启了通知权限。');
    return;
  }
  if (Notification.permission === 'granted') {
    alert('✅ 通知权限已授予。即将发送一条测试通知（请切到后台观察）。');
    new Notification('🔔 测试通知', { body: '如果你看到了这条通知，说明网页通知可以正常工作！' });
  } else if (Notification.permission === 'denied') {
    alert('❌ 通知权限被拒绝。请去系统设置里允许该 App 发送通知。');
  } else {
    alert('⏳ 正在请求通知权限...');
    try {
      const p = await Notification.requestPermission();
      if (p === 'granted') {
        new Notification('🔔 测试通知', { body: '权限获取成功！' });
      } else {
        alert('❌ 权限请求失败或被拒绝。');
      }
    } catch (e) {
      alert('❌ 请求权限出错：' + e.message);
    }
  }
}

// 核心：调用网页原生通知
function showSystemNotification(title, body) {
  if (!("Notification" in window)) return false;
  if (Notification.permission === 'granted') {
    try {
      new Notification(title, { body: body });
      return true;
    } catch(e) {
      console.warn('通知失败', e);
      return false;
    }
  } else if (Notification.permission !== 'denied') {
    Notification.requestPermission().then(p => {
      if (p === 'granted') {
        try { new Notification(title, { body: body }); } catch(e) {}
      }
    });
  }
  return false;
}

function loadLocal(){try{const d=localStorage.getItem(SK);if(d)db=JSON.parse(d);['tasks','habits','lists'].forEach(k=>{if(!db[k])db[k]=[]});['notes','summaries','photos'].forEach(k=>{if(!db[k])db[k]={}});if(!db.globalPhotos)db.globalPhotos=[];if(!db.photoHistory)db.photoHistory=[];ensureRS();db.habits.forEach(h=>{if(typeof h.remindTime!=='string')h.remindTime=''});const all=[];Object.keys(db.photos).forEach(k=>{(db.photos[k]||[]).forEach(p=>{if(!all.includes(p))all.push(p)})});(db.globalPhotos||[]).forEach(p=>{if(!all.includes(p))all.push(p)});all.forEach(p=>{if(!db.photoHistory.includes(p))db.photoHistory.push(p)});if(db.photoHistory.length>30)db.photoHistory=db.photoHistory.slice(0,30);saveLocal()}catch(e){db={tasks:[],notes:{},habits:[],summaries:{},lists:[],photos:{},globalPhotos:[],photoHistory:[],reminderState:{tasks:{},habits:{},habitSnooze:{}}}}}
function saveLocal(){localStorage.setItem(SK,JSON.stringify(db))}
function getSyncConfig(){try{return JSON.parse(localStorage.getItem(YK))||{user:'',repo:'',token:''}}catch(e){return{user:'',repo:'',token:''}}}
function saveSyncConfigToStorage(c){localStorage.setItem(YK,JSON.stringify(c))}
function openSyncModal(){const c=getSyncConfig();document.getElementById('sync-user').value=c.user||'';document.getElementById('sync-repo').value=c.repo||'';document.getElementById('sync-token').value=c.token||'';document.getElementById('sync-status').textContent=(c.user?'配置已保存，可上传/下载':'尚未配置');document.getElementById('sync-modal').classList.add('show')}
function closeSyncModal(){document.getElementById('sync-modal').classList.remove('show')}
function saveSyncConfig(){const c={user:document.getElementById('sync-user').value.trim(),repo:document.getElementById('sync-repo').value.trim(),token:document.getElementById('sync-token').value.trim()};if(!c.user||!c.repo||!c.token){alert('请完整填写');return}saveSyncConfigToStorage(c);document.getElementById('sync-status').textContent='配置已保存！';alert('配置保存成功！')}
async function uploadToCloud(){const c=getSyncConfig();if(!c.user||!c.repo||!c.token){alert('请先填写 Gitee 信息');return}const s=document.getElementById('sync-status');s.textContent='正在上传...';try{let sha=null;const gu=`https://gitee.com/api/v5/repos/${c.user}/${c.repo}/contents/vicky-planner-data.json?access_token=${c.token}&ref=master`;const gr=await fetch(gu);if(gr.ok){const g=await gr.json();sha=g.sha}const content=btoa(unescape(encodeURIComponent(JSON.stringify(db))));const pu=`https://gitee.com/api/v5/repos/${c.user}/${c.repo}/contents/vicky-planner-data.json`;const pb={access_token:c.token,content,message:`同步 ${new Date().toLocaleString()}`,branch:'master'};if(sha)pb.sha=sha;const pr=await fetch(pu,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(pb)});if(pr.ok){s.textContent='上传成功！';alert('上传成功！')}else{const e=await pr.json();s.textContent='上传失败：'+(e.message||'未知');alert('上传失败')}}catch(e){s.textContent='网络错误：'+e.message;alert('上传失败')}}
async function downloadFromCloud(){const c=getSyncConfig();if(!c.user||!c.repo||!c.token){alert('请先填写 Gitee 信息');return}const s=document.getElementById('sync-status');s.textContent='正在下载...';try{const gu=`https://gitee.com/api/v5/repos/${c.user}/${c.repo}/contents/vicky-planner-data.json?access_token=${c.token}&ref=master`;const r=await fetch(gu);if(!r.ok){s.textContent='下载失败：云端无数据';alert('下载失败');return}const d=await r.json();const cs=decodeURIComponent(escape(atob(d.content)));const cd=JSON.parse(cs);if(!confirm('将从云端覆盖本地数据，确定吗？')){s.textContent='已取消';return}db=cd;['tasks','habits','lists'].forEach(k=>{if(!db[k])db[k]=[]});['notes','summaries','photos'].forEach(k=>{if(!db[k])db[k]={}});if(!db.globalPhotos)db.globalPhotos=[];if(!db.photoHistory)db.photoHistory=[];ensureRS();db.habits.forEach(h=>{if(typeof h.remindTime!=='string')h.remindTime=''});saveLocal();renderAll();renderHabits();renderBook();renderLists();s.textContent='下载成功！';alert('下载成功！')}catch(e){s.textContent='网络错误：'+e.message;alert('下载失败')}}
function exportData(){const d=JSON.stringify(db,null,2);const b=new Blob([d],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`vicky-planner-备份-${formatDate(new Date())}.json`;a.click();URL.revokeObjectURL(u)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const im=JSON.parse(ev.target.result);if(!confirm('将覆盖当前所有数据，确定吗？'))return;db=im;['tasks','habits','lists'].forEach(k=>{if(!db[k])db[k]=[]});['notes','summaries','photos'].forEach(k=>{if(!db[k])db[k]={}});if(!db.globalPhotos)db.globalPhotos=[];if(!db.photoHistory)db.photoHistory=[];ensureRS();db.habits.forEach(h=>{if(typeof h.remindTime!=='string')h.remindTime=''});saveLocal();renderAll();renderHabits();renderBook();renderLists();alert('导入成功！')}catch(e){alert('文件格式错误')}};r.readAsText(f);e.target.value=''}
function addInboxTask(el){const t=el.value.trim();if(!t)return;db.tasks.push({id:'task-'+Date.now()+Math.random().toString(36).slice(2),week_key:null,day:null,title:t,done:false,dueDate:'',details:''});el.value='';saveLocal();renderAll()}

function renderHabits(){const l=document.getElementById('habit-list');l.innerHTML='';if(!db.habits.length){l.innerHTML='<div style="text-align:center;color:var(--t2);margin-top:40px">还没有习惯，点右上角新建一个吧！</div>';return}const td=new Date(),ts=todayStr(),cm=getMonday(td);db.habits.forEach((h,idx)=>{const c=document.createElement('div');c.className='hc';const bc=HC[idx%HC.length];let st=0;let d=new Date(td);while(true){const ds=formatDate(d),v=h.records[ds];if(v==='done'||v===true){st++;d.setDate(d.getDate()-1)}else break}let hm='';for(let w=16;w>=0;w--){const ws=new Date(cm);ws.setDate(ws.getDate()-w*7);for(let j=0;j<7;j++){const dt=new Date(ws);dt.setDate(dt.getDate()+j);const ds=formatDate(dt);if(dt>td){hm+='<div class="hm fu"></div>'}else{const v=h.records[ds];let sty='';if(v==='done'||v===true)sty=`background:${bc};`;else if(v==='makeup')sty=`background:${bc};opacity:.4;`;hm+=`<div class="hm" style="${sty}" onclick="cycleHabitRecord('${h.id}','${ds}')" title="${ds}"></div>`}}}const ck=h.records[ts]==='done'||h.records[ts]===true;const bt=ck?'✅ 已打卡':'⭕ 今日打卡';c.innerHTML=`<div class="ht2"><span class="hn">${esc(h.name)}</span><div class="htr"><button class="hrb ${h.remindTime?'on':''}" onclick="setHabitReminder('${h.id}')">${h.remindTime?'⏰ '+h.remindTime:'⏰ 设提醒'}</button><span class="hs">连续 ${st} 天</span></div></div><div class="hmc"><div class="hmg">${hm}</div></div><div class="hml"><span class="sw" style="background:${bc}"></span><span>完成</span><span class="sw" style="background:${bc};opacity:.4;margin-left:8px"></span><span>补签</span></div><div class="hf"><button class="cib ${ck?'ck':''}" onclick="toggleHabitRecord('${h.id}','${ts}')">${bt}</button><div class="ha"><button onclick="deleteHabit('${h.id}')">删除习惯</button></div></div>`;l.appendChild(c)})}
function switchBookPeriod(p){bookPeriod=p;document.querySelectorAll('.bt button').forEach(b=>b.classList.toggle('active',b.dataset.period===p));bookDate=new Date();renderBook()}
function getPeriodLabel(){if(bookPeriod==='day')return`${bookDate.getFullYear()}年${bookDate.getMonth()+1}月`;if(bookPeriod==='week'){const ws=getMonday(bookDate),we=new Date(ws);we.setDate(we.getDate()+6);return`${ws.getMonth()+1}月${ws.getDate()}日 - ${we.getMonth()+1}月${we.getDate()}日`}if(bookPeriod==='month')return`${bookDate.getFullYear()}年${bookDate.getMonth()+1}月`;return`${bookDate.getFullYear()}年`}
function renderDaySummary(){const c=document.getElementById('month-calendar');c.innerHTML='';const y=bookDate.getFullYear(),m=bookDate.getMonth();const fd=new Date(y,m,1),fw=(fd.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),pmd=new Date(y,m,0).getDate();const inner=document.createElement('div');inner.className='mc';inner.style.cssText='width:100%;height:100%;';const wd=document.createElement('div');wd.className='mw';['一','二','三','四','五','六','日'].forEach(n=>{const el=document.createElement('div');el.className='mwd';el.textContent='周'+n;wd.appendChild(el)});inner.appendChild(wd);const g=document.createElement('div');g.className='mdg';for(let i=0;i<42;i++){let cd,om=false;if(i<fw){const day=pmd-fw+i+1;cd=new Date(y,m-1,day);om=true}else if(i<fw+dim){const day=i-fw+1;cd=new Date(y,m,day)}else{const day=i-fw-dim+1;cd=new Date(y,m+1,day);om=true}const ds=formatDate(cd),wk=getWeekKey(getMonday(cd)),di=(cd.getDay()+6)%7,nk=`${wk}-${di}`;const it=ds===formatDate(new Date());const cell=document.createElement('div');cell.className='mdc'+(om?' om':'')+(it?' td':'');const hd=document.createElement('div');hd.className='mdh';const num=document.createElement('span');num.className='mdn';num.textContent=cd.getDate();hd.appendChild(num);const ps=db.photos[nk]||[],gp=db.globalPhotos||[],ap=[...ps,...gp];if(ap.length>0){const pe=document.createElement('div');pe.className='mdp';const im=document.createElement('img');im.src=ap[0];im.className='mdph';pe.appendChild(im);hd.appendChild(pe)}cell.appendChild(hd);const te=document.createElement('div');te.className='mdt';const dt=db.tasks.filter(t=>t.week_key===wk&&t.day===di);dt.slice(0,4).forEach(t=>{const tel=document.createElement('div');tel.className='mt '+(t.done?'dn':'pd');tel.textContent=t.title;tel.title=t.title;te.appendChild(tel)});if(dt.length>4){const mo=document.createElement('div');mo.className='mm';mo.textContent=`+${dt.length-4} 个任务`;te.appendChild(mo)}cell.appendChild(te);cell.onclick=()=>openDayDetailModal(cd);g.appendChild(cell)}inner.appendChild(g);c.appendChild(inner)}
function renderWeekSummary(){const c=document.getElementById('month-calendar');c.innerHTML='';const ws=getMonday(bookDate),wk=getWeekKey(ws),wn=wk.split('-W')[1];const dn=['周一','周二','周三','周四','周五','周六','周日'];const v=document.createElement('div');v.className='wsv';const t=document.createElement('div');t.className='wst';t.innerHTML=`第 ${wn} 周 <span class="ar">▸</span>`;t.onclick=()=>openWeekDetailModal();v.appendChild(t);const l=document.createElement('div');l.className='wdl';for(let i=0;i<7;i++){const cd=new Date(ws);cd.setDate(cd.getDate()+i);const dk=`${wk}-${i}`,it=formatDate(cd)===formatDate(new Date());const r=document.createElement('div');r.className='wdr'+(it?' td':'');const de=document.createElement('div');de.className='wdd';de.innerHTML=`${dn[i]}<span class="wdn">${cd.getMonth()+1}/${cd.getDate()}</span>`;r.appendChild(de);const pe=document.createElement('div');pe.className='wdp';const ap=[...(db.photos[dk]||[]),...(db.globalPhotos||[])];if(ap.length===0)pe.innerHTML='<span class="wdpe">—</span>';else ap.slice(0,2).forEach(p=>{const im=document.createElement('img');im.src=p;im.className='wdph';pe.appendChild(im)});r.appendChild(pe);const te=document.createElement('div');te.className='wdt';const dt=db.tasks.filter(t=>t.week_key===wk&&t.day===i);if(dt.length===0)te.innerHTML='<span class="wdte">无任务</span>';else dt.forEach(t=>{const tg=document.createElement('span');tg.className='wdtg'+(t.done?' dn':'');tg.textContent=t.title;te.appendChild(tg)});r.appendChild(te);r.onclick=()=>openDayDetailModal(cd);l.appendChild(r)}v.appendChild(l);c.appendChild(v)}
function renderMonthSummary(){const c=document.getElementById('month-calendar');c.innerHTML='';const v=document.createElement('div');v.className='mwv';const y=bookDate.getFullYear(),m=bookDate.getMonth(),ms=new Date(y,m,1),me=new Date(y,m+1,0);const wks=[];let cur=getMonday(ms);while(cur<=me){const wk=getWeekKey(cur);if(!wks.includes(wk))wks.push(wk);cur.setDate(cur.getDate()+7)}const dn=['周一','周二','周三','周四','周五','周六','周日'];wks.forEach(wk=>{const wn=wk.split('-W')[1],yy=parseInt(wk.split('-W')[0]),ys=new Date(yy,0,1);let ws=getMonday(ys);ws.setDate(ws.getDate()+(parseInt(wn)-1)*7);const we=new Date(ws);we.setDate(we.getDate()+6);const bl=document.createElement('div');bl.className='mwb';bl.innerHTML=`<div class="mwh"><span>第 ${wn} 周</span><span class="rg">${ws.getMonth()+1}/${ws.getDate()} - ${we.getMonth()+1}/${we.getDate()}</span></div>`;const dw=document.createElement('div');dw.className='mwds';for(let i=0;i<7;i++){const cd=new Date(ws);cd.setDate(cd.getDate()+i);const dt=db.tasks.filter(t=>t.week_key===wk&&t.day===i);const dc=dt.filter(t=>t.done).length;const re=document.createElement('div');re.className='mwdr';re.innerHTML=`<span>${dn[i]} ${cd.getMonth()+1}/${cd.getDate()}</span><span class="dc${dc===0?' z':''}">${dc}/${dt.length}</span>`;dw.appendChild(re)}bl.appendChild(dw);bl.onclick=()=>{bookPeriod='week';bookDate=new Date(ws);document.querySelectorAll('.bt button').forEach(b=>b.classList.toggle('active',b.dataset.period==='week'));renderBook()};v.appendChild(bl)});c.appendChild(v)}
function renderYearSummary(){const c=document.getElementById('month-calendar');c.innerHTML='';const y=bookDate.getFullYear();const v=document.createElement('div');v.className='ysv';const t=document.createElement('div');t.className='yst';t.innerHTML=`${y}年 <span class="ar">▸</span>`;t.onclick=()=>openYearDetailModal();v.appendChild(t);const g=document.createElement('div');g.className='yg';for(let m=0;m<12;m++){const ms=new Date(y,m,1),me=new Date(y,m+1,0);const mt=db.tasks.filter(t=>{if(!t.week_key||t.day===null||t.day===undefined)return false;const fm=getMonday(new Date(y,m,1)),lm=getMonday(me);const c2=new Date(fm);while(c2<=lm){const tg=new Date(c2);tg.setDate(tg.getDate()+Number(t.day));if(tg>=ms&&tg<=me&&getWeekKey(c2)===t.week_key)return true;c2.setDate(c2.getDate()+7)}return false});const dc=mt.filter(t=>t.done).length;const cd=document.createElement('div');cd.className='ymc';cd.innerHTML=`<div class="ymn">${m+1}月</div><div class="ymct">${dc}/${mt.length}</div>`;cd.onclick=()=>{bookPeriod='month';bookDate=new Date(y,m,1);document.querySelectorAll('.bt button').forEach(b=>b.classList.toggle('active',b.dataset.period==='month'));renderBook()};g.appendChild(cd)}v.appendChild(g);c.appendChild(v)}
function renderBook(){const le=document.getElementById('book-period-label'),bl=getPeriodLabel();le.onclick=null;le.style.cursor='default';le.style.color='';if(bookPeriod==='day'){le.textContent=bl;document.getElementById('book-period-sub').textContent='日历 · 点击日期查看详情';renderDaySummary();document.getElementById('book-bottom-title').textContent='今日心得';document.getElementById('book-summary-input').value=db.notes[todayKey()]||''}else if(bookPeriod==='week'){le.textContent=bl;document.getElementById('book-period-sub').textContent='点击上方"第xx周"查看该周总结';renderWeekSummary();const wk=getWeekKey(getMonday(bookDate));document.getElementById('book-bottom-title').textContent=`第 ${wk.split('-W')[1]} 周心得`;document.getElementById('book-summary-input').value=db.summaries['week-'+wk]||''}else if(bookPeriod==='month'){le.textContent=bl+' ▸';le.style.cursor='pointer';le.style.color='var(--ac)';le.onclick=()=>openMonthDetailModal();document.getElementById('book-period-sub').textContent='点击上方标题查看本月心得';renderMonthSummary();const mk=bookDate.getFullYear()+'-'+String(bookDate.getMonth()+1).padStart(2,'0');document.getElementById('book-bottom-title').textContent=`${bookDate.getFullYear()}年${bookDate.getMonth()+1}月心得`;document.getElementById('book-summary-input').value=db.summaries['month-'+mk]||''}else{le.textContent=bl;document.getElementById('book-period-sub').textContent='点击"202x年"查看全年总结';renderYearSummary();document.getElementById('book-bottom-title').textContent=`${bookDate.getFullYear()}年心得`;document.getElementById('book-summary-input').value=db.summaries['year-'+bookDate.getFullYear()]||''}document.getElementById('book-period-label-bottom').textContent=bl}
function saveBookSummary(){const t=document.getElementById('book-summary-input').value;if(bookPeriod==='day')db.notes[todayKey()]=t;else if(bookPeriod==='week')db.summaries['week-'+getWeekKey(getMonday(bookDate))]=t;else if(bookPeriod==='month')db.summaries['month-'+bookDate.getFullYear()+'-'+String(bookDate.getMonth()+1).padStart(2,'0')]=t;else db.summaries['year-'+bookDate.getFullYear()]=t;saveLocal();alert('已保存！')}
function renderLists(){const g=document.getElementById('list-grid');g.innerHTML='';if(!db.lists.length){g.innerHTML='<div style="text-align:center;color:var(--t2);margin-top:40px">还没有清单，点右上角新建一个吧！</div>';return}db.lists.forEach(l=>{const tot=l.items.length,dn=l.items.filter(i=>i.done).length,pc=tot===0?0:Math.round(dn/tot*100);const c=document.createElement('div');c.className='lc';let ih='';l.items.forEach(it=>{ih+=`<div class="lit ${it.done?'dn':''}"><button class="csq" onclick="toggleListItem('${l.id}','${it.id}',this)"></button><span class="ttl" onclick="toggleListItem('${l.id}','${it.id}',this)" style="cursor:pointer">${esc(it.text)}</span><button style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:14px" onclick="deleteListItem('${l.id}','${it.id}')">×</button></div>`});c.innerHTML=`<div class="lch"><span class="lct">${esc(l.name)}</span><div class="lca"><button onclick="deleteList('${l.id}')" title="删除清单">🗑</button></div></div><div class="lp"><div class="pb"><div class="pf" style="width:${pc}%"></div></div><span>${dn}/${tot}</span></div><div class="li">${ih||'<div style="color:var(--t3);font-size:13px;padding:4px 0">暂无项目</div>'}</div><div class="atr" style="margin-top:4px"><input type="text" placeholder="添加项目..." onkeydown="if(event.key==='Enter')addListItem('${l.id}',this)"><button onclick="addListItem('${l.id}',this.previousElementSibling)">+</button></div>`;g.appendChild(c)})}
const RICK=25000;let ac=null;
function ensureAudio(){try{if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C()}if(ac&&ac.state==='suspended')ac.resume()}catch(e){}}
document.addEventListener('pointerdown',ensureAudio,true);document.addEventListener('keydown',ensureAudio,true);
function playReminderSound(){ensureAudio();if(navigator.vibrate){try{navigator.vibrate([80,60,80])}catch(e){}}if(!ac)return;try{const n=ac.currentTime;[0,.18,.36].forEach((o,i)=>{const os=ac.createOscillator(),g=ac.createGain();os.type='sine';os.frequency.value=i===2?1046.5:880;g.gain.setValueAtTime(.0001,n+o);g.gain.exponentialRampToValueAtTime(.18,n+o+.02);g.gain.exponentialRampToValueAtTime(.0001,n+o+.24);os.connect(g);g.connect(ac.destination);os.start(n+o);os.stop(n+o+.28)})}catch(e){}}
function createReminderCard(o){const s=document.getElementById('rs');if(!s)return null;if(o.key&&s.querySelector('[data-key="'+o.key+'"]'))return null;const c=document.createElement('div');c.className='remc'+(o.type?' '+o.type:'');if(o.key)c.setAttribute('data-key',o.key);const ic=document.createElement('div');ic.className='remi';ic.textContent=o.icon||'⏰';const b=document.createElement('div');b.className='remb';const k=document.createElement('div');k.className='remk';k.textContent=o.kicker||'提醒';b.appendChild(k);const t=document.createElement('div');t.className='remt';t.textContent=o.title||'';b.appendChild(t);if(o.sub){const sb=document.createElement('div');sb.className='rems';sb.textContent=o.sub;b.appendChild(sb)}if(o.actions&&o.actions.length){const a=document.createElement('div');a.className='rema';o.actions.forEach(x=>{const btn=document.createElement('button');btn.className=x.primary?'pr':'gh';btn.textContent=x.label;btn.onclick=()=>{try{x.onClick&&x.onClick()}catch(e){console.error(e)}closeReminderCard(c)};a.appendChild(btn)});b.appendChild(a)}const x=document.createElement('button');x.className='remx';x.textContent='×';x.onclick=()=>closeReminderCard(c);c.appendChild(ic);c.appendChild(b);c.appendChild(x);s.appendChild(c);return c}
function closeReminderCard(c){if(!c||!c.parentNode)return;c.classList.add('out');setTimeout(()=>{if(c.parentNode)c.remove()},280)}
function dismissReminder(k){const s=document.getElementById('rs');if(!s)return;const c=s.querySelector('[data-key="'+k+'"]');if(c)closeReminderCard(c)}
function mondayFromWeekKey(wk){try{const y=Number(wk.split('-W')[0]);let m=getMonday(new Date(y,0,1));for(let i=0;i<60;i++){if(getWeekKey(m)===wk)return new Date(m);m.setDate(m.getDate()+7)}}catch(e){}return getMonday(new Date())}
function switchToView(v){const t=document.querySelector('.tab[data-view="'+v+'"]');if(t&&!t.classList.contains('active'))t.click()}
function gotoTask(id){const t=db.tasks.find(x=>x.id===id);if(!t)return;switchToView('plan');if(t.week_key){currentMonday=mondayFromWeekKey(t.week_key);currentWeekKey=t.week_key}selectedDay=(t.day===null||t.day===undefined)?0:Number(t.day);selectedTaskId=t.id;renderAll()}
function gotoHabit(id){switchToView('habits');renderHabits()}
function pushTaskReminder(t,due,now){const om=Math.max(0,Math.round((now-due)/6e4));let ts='';try{ts=new Date(due).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}catch(e){}
  // 触发原生通知
  showSystemNotification('⏰ 任务提醒: ' + t.title, om>0?`已超时 ${om} 分钟`:`${ts} · 该开始啦`);
  
  createReminderCard({key:'task-'+t.id,type:om>0?'urg':'',icon:'⏰',kicker:om>0?'任务时间已到':'任务到时间啦',title:t.title,sub:om>0?`${ts} · 已超时 ${om} 分钟`:`${ts} · 该开始啦`,actions:[{label:'✔ 标记完成',primary:true,onClick:()=>{const tt=db.tasks.find(x=>x.id===t.id);if(tt){tt.done=true;saveLocal();renderAll();renderBook()}}},{label:'⏱ 稍后10分钟',onClick:()=>{ensureRS();const st=db.reminderState.tasks[t.id];if(st){st.notified=true;st.snoozeUntil=Date.now()+6e5}saveLocal()}},{label:'查看',onClick:()=>gotoTask(t.id)}]})}
function pushHabitReminder(h){
  // 触发原生通知
  showSystemNotification('🔥 习惯打卡提醒', h.name + ' 今天还没打卡哦');
  
  createReminderCard({key:'habit-'+h.id,type:'hb2c',icon:'🔥',kicker:'习惯打卡提醒',title:h.name,sub:`今天还没打卡（每天 ${h.remindTime} 提醒）`,actions:[{label:'✔ 立即打卡',primary:true,onClick:()=>{const hh=db.habits.find(x=>x.id===h.id);if(hh){hh.records[todayStr()]='done';saveLocal();renderHabits();renderBook()}}},{label:'⏱ 稍后30分钟',onClick:()=>{ensureRS();delete db.reminderState.habits[h.id];db.reminderState.habitSnooze[h.id]=Date.now()+18e5;saveLocal()}},{label:'查看',onClick:()=>gotoHabit(h.id)}]})}
function checkReminders(){ensureRS();const rs=db.reminderState,now=Date.now(),nd=new Date(now),ts=formatDate(nd),nm=nd.getHours()*60+nd.getMinutes();let fired=0;db.tasks.forEach(t=>{if(!t.dueDate||t.done)return;const due=new Date(t.dueDate).getTime();if(isNaN(due))return;if(now<due)return;if(now-due>864e5)return;let st=rs.tasks[t.id];if(!st||st.due!==due)st=rs.tasks[t.id]={due:due,notified:false,snoozeUntil:0};if(st.notified){if(!st.snoozeUntil)return;if(now<st.snoozeUntil)return;st.snoozeUntil=0}st.notified=true;fired++;pushTaskReminder(t,due,now)});db.habits.forEach(h=>{if(!h.remindTime)return;const p=String(h.remindTime).split(':'),hh=+p[0],mm=+p[1];if(isNaN(hh)||isNaN(mm))return;const tm=hh*60+mm;if(nm<tm)return;if(nm-tm>180)return;const tt=new Date(nd.getFullYear(),nd.getMonth(),nd.getDate(),hh,mm).getTime();const rec=h.records[ts];if(rec==='done'||rec===true)return;const sn=rs.habitSnooze[h.id]||0;if(now<sn)return;const last=rs.habits[h.id]||0;if(last>=tt)return;rs.habits[h.id]=now;fired++;pushHabitReminder(h)});if(fired>0){saveLocal();playReminderSound()}}
function startReminderEngine(){ensureRS();setInterval(checkReminders,RICK);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});window.addEventListener('focus',checkReminders);setTimeout(checkReminders,1500)}
document.getElementById('book-prev').addEventListener('click',()=>{if(bookPeriod==='day')bookDate=new Date(bookDate.getFullYear(),bookDate.getMonth()-1,1);else if(bookPeriod==='week')bookDate.setDate(bookDate.getDate()-7);else if(bookPeriod==='month')bookDate=new Date(bookDate.getFullYear(),bookDate.getMonth()-1,1);else bookDate=new Date(bookDate.getFullYear()-1,0,1);renderBook()});

document.querySelectorAll('.tab').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));tab.classList.add('active');const v=tab.dataset.view;document.getElementById('view-'+v).classList.add('active');if(v==='plan'){document.getElementById('header-bottom-display').style.display='block';renderAll()}else{document.getElementById('header-bottom-display').style.display='none';if(v==='habits')renderHabits();else if(v==='book')renderBook();else if(v==='lists')renderLists()}})});
['calendar-modal','list-modal','sync-modal','day-detail-modal','period-detail-modal','crop-modal','tag-action-modal'].forEach(id=>{document.getElementById(id).addEventListener('click',e=>{if(e.target.id===id)document.getElementById(id).classList.remove('show')})});
loadLocal();renderAll();renderHabits();renderBook();renderLists();startReminderEngine();
